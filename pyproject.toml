[project]
name = "recommendation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diego Avila", email = "aviladiego2009@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "redis>=8.1.0",
]

[project.scripts]
recommendation-system = "recommendation_system:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]
